<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <rect width="160" height="160" fill="#8fb4e3"/>
  <!-- leafy tendril -->
  <path d="M0 120 C30 100 50 140 80 120 S130 100 160 120" fill="none" stroke="#3f7d3a" stroke-width="5" stroke-linecap="round"/>
  <path d="M0 120 C30 100 50 140 80 120 S130 100 160 120" fill="none" stroke="#e9a35c" stroke-width="1.5" stroke-dasharray="1 5" stroke-linecap="round"/>
  <ellipse cx="40" cy="108" rx="12" ry="6" transform="rotate(-30 40 108)" fill="#8cc63f"/>
  <ellipse cx="118" cy="128" rx="12" ry="6" transform="rotate(25 118 128)" fill="#8cc63f"/>
  <!-- big flower -->
  <g transform="translate(48 46)">
    <g fill="#e94f8a" stroke="#f6dcc0" stroke-width="2">
      <ellipse rx="11" ry="20" transform="rotate(0) translate(0 -16)"/>
      <ellipse rx="11" ry="20" transform="rotate(72) translate(0 -16)"/>
      <ellipse rx="11" ry="20" transform="rotate(144) translate(0 -16)"/>
      <ellipse rx="11" ry="20" transform="rotate(216) translate(0 -16)"/>
      <ellipse rx="11" ry="20" transform="rotate(288) translate(0 -16)"/>
    </g>
    <circle r="10" fill="#f4c04f" stroke="#c9472f" stroke-width="2"/>
    <circle r="3" fill="#c9472f"/>
    <circle r="40" fill="none" stroke="#f6dcc0" stroke-width="2.5" stroke-dasharray="0.5 6" stroke-linecap="round"/>
  </g>
  <!-- small flower -->
  <g transform="translate(124 52)">
    <g fill="#1a47a8">
      <circle cx="0" cy="-9" r="7"/><circle cx="9" cy="0" r="7"/><circle cx="0" cy="9" r="7"/><circle cx="-9" cy="0" r="7"/>
    </g>
    <circle r="5" fill="#fbf8f1"/>
    <circle r="21" fill="none" stroke="#f6dcc0" stroke-width="2" stroke-dasharray="0.5 5" stroke-linecap="round"/>
  </g>
  <!-- dots (titik) -->
  <g fill="#fbf8f1">
    <circle cx="100" cy="14" r="2"/><circle cx="12" cy="150" r="2"/><circle cx="146" cy="150" r="2"/><circle cx="92" cy="86" r="2"/><circle cx="10" cy="20" r="2"/>
  </g>
</svg>
